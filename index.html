<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADITYA VERMA</title>
  <style>
    :root {
      --paper: #eceae2;
      --ink: #1d1d1d;
      --line: rgba(29,29,29,0.8);
      --accent: #ff6a00;
      --card: rgba(255,255,255,0.08);
      --button-bg: rgba(0,0,0,0.34);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #000;
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6) contrast(1.05) saturate(0.8);
      z-index: 0;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1;
    }

    .sound-btn, .nav-btn {
      position: fixed;
      top: 26px;
      z-index: 30;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.35);
      color: var(--accent);
      text-transform: lowercase;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 10px 16px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .sound-btn {
      left: 26px;
    }

    .nav-btn {
      right: 26px;
      background: rgba(0,0,0,0.28);
    }

    .sound-btn:hover, .nav-btn:hover,
    .sound-btn:focus-visible, .nav-btn:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(255,106,0,0.95);
      outline: none;
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 84px 28px 40px;
    }

    .panel {
      width: min(1200px, 100%);
      min-height: min(82vh, 860px);
      background: rgba(236,234,226,0.96);
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 36px 34px 48px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.16);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 26px;
    }

    .sound-placeholder {
      min-width: 120px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,0.02);
      font-size: 15px;
      color: var(--ink);
      font-weight: 500;
    }

    .nav-group {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      height: 52px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,0.02);
      color: var(--ink);
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
    }

    .intro-wrap {
      display: flex;
      justify-content: center;
      padding-top: 18px;
      margin-bottom: 42px;
    }

    .intro-box {
      width: min(60%, 720px);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      font-size: clamp(19px, 2vw, 28px);
      letter-spacing: 0.02em;
      color: var(--ink);
      text-align: center;
      padding: 28px 24px;
    }

    .film-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 34px 36px;
      align-items: start;
    }

    .film-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .movie-slot {
      height: 220px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .movie-slot iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: black;
    }

    .film-text {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 0;
      font-size: 17px;
      line-height: 1.5;
      color: var(--ink);
      padding: 8px 12px;
    }

    .contact-wrap {
      width: min(760px, 100%);
      margin: 36px auto 0;
      position: relative;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      height: 64px;
    }

    .contact-pill {
      position: relative;
      z-index: 2;
      border: 2px solid var(--line);
      background: rgba(255,255,255,0.08);
      color: var(--ink);
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      letter-spacing: 0.04em;
      font-weight: 600;
      transition: transform 0.35s ease;
    }

    .contact-pill:hover,
    .contact-pill:focus-visible {
      transform: translateY(-1px);
      outline: none;
    }

    .contact-actions {
      position: absolute;
      right: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      width: 0;
      overflow: hidden;
      pointer-events: none;
      transition: width 0.38s ease, opacity 0.25s ease;
    }

    .contact-wrap.open .contact-actions {
      opacity: 1;
      width: 420px;
      pointer-events: auto;
    }

    .contact-wrap.open .contact-pill {
      transform: translateX(-170px);
    }

    .contact-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      background: rgba(0,0,0,0.06);
      border: 2px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }

    @media (max-width: 800px) {
      .panel {
        padding: 24px 20px 32px;
      }

      .header-row {
        flex-direction: column;
        align-items: stretch;
      }

      .nav-group {
        justify-content: flex-start;
      }

      .intro-box {
        width: 100%;
      }

      .film-grid {
        grid-template-columns: 1fr;
      }

      .movie-slot {
        height: 180px;
      }

      .contact-wrap {
        justify-content: center;
      }

      .contact-wrap.open .contact-pill {
        transform: translateX(-110px);
      }

      .contact-actions {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline preload="auto" src="https://raw.githubusercontent.com/1adityaverma/ADITYAVERMA/main/video.mp4"></video>
  <div class="overlay"></div>

  <button class="sound-btn" id="soundToggle" type="button" aria-pressed="false">Sound: off</button>
  <a class="nav-btn" href="about.html">About</a>

  <main class="page">
    <div class="panel">
      <div class="header-row">
        <div class="sound-placeholder">off</div>

        <div class="nav-group">
          <a class="nav-link" href="index.html">Portfolio</a>
          <a class="nav-link" href="about.html">About</a>
        </div>
      </div>

      <div class="intro-wrap">
        <div class="intro-box">intro</div>
      </div>

      <div class="film-grid">
        <article class="film-card">
          <div class="movie-slot">
            <iframe src="https://drive.google.com/file/d/1DPG3PpijYQlwUSTsHIgm4hXM5gdxFR90/preview" allow="autoplay" title="Movie 1 preview"></iframe>
          </div>
          <div class="film-text">movie 1</div>
        </article>

        <article class="film-card">
          <div class="movie-slot">
            <iframe src="https://www.youtube.com/embed/4jKRe7fj238?si=_s5uh9slsGuTxrKc" title="Movie 2 preview" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </div>
          <div class="film-text">movie 2</div>
        </article>
      </div>

      <div class="contact-wrap" id="contactWrap">
        <button class="contact-pill" id="contactBtn" type="button" aria-expanded="false">Contact</button>
        <div class="contact-actions" aria-live="polite">
          <a href="mailto:adityavermaworkid@gmail.com">Email</a>
          <a href="https://www.linkedin.com/in/adityaverma/" target="_blank" rel="noreferrer">LinkedIn</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById('bg-video');
    const soundToggle = document.getElementById('soundToggle');
    video.muted = true;
    video.play().catch(() => {});

    soundToggle.addEventListener('click', () => {
      video.muted = !video.muted;
      soundToggle.textContent = video.muted ? 'Sound: off' : 'Sound: on';
      soundToggle.setAttribute('aria-pressed', String(!video.muted));
      video.play().catch(() => {});
    });

    const contactWrap = document.getElementById('contactWrap');
    const contactBtn = document.getElementById('contactBtn');

    contactBtn.addEventListener('click', () => {
      const open = !contactWrap.classList.contains('open');
      contactWrap.classList.toggle('open', open);
      contactBtn.setAttribute('aria-expanded', String(open));
    });
  </script>
</body>
</html>
